name: CI and Deploy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install dependencies
        run: |
          bundle config set --local force_ruby_platform true
          bundle install --jobs 4

      - name: Generate categories
        run: ruby bin/generate_categories.rb

      - name: Generate tags
        run: ruby bin/generate_tags.rb

      - name: Build Jekyll site
        run: JEKYLL_ENV=production bundle exec jekyll build

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: jekyll-site
          path: _site/
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: jekyll-site
          path: _site

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ec2-18-196-68-187.eu-central-1.compute.amazonaws.com >> ~/.ssh/known_hosts

      - name: Deploy to production
        run: |
          rsync --delete --progress --stats -ru _site/ \
            -e "ssh -i ~/.ssh/deploy_key" \
            ec2-user@ec2-18-196-68-187.eu-central-1.compute.amazonaws.com:/usr/share/nginx/html
